        <div class="field-wrap">
          <label class="field-label" for="login-pass">Mot de passe</label>
          <div class="pass-wrap">
            <input class="field-input" type="password" id="login-pass" name="password" autocomplete="current-password" placeholder="••••••••"/>

          </div>
        </div>
        <div id="login-error" class="error-box hidden"></div>
        <button type="submit" class="btn-primary">Se connecter</button>
      </form>
      <div class="login-footer">🔒 Données hébergées en Suisse · Zurich</div>
      <div class="login-bascule" id="login-bascule" style="display:none">Vous êtes conseiller ? <button type="button" onclick="ouvrirCoteConseiller()">Ouvrir REX CRM</button></div>

  // Enregistrement du service worker — rend le CRM installable comme une vraie application
  // (icône, ouverture en plein écran, hors-ligne minimal). Ne bloque jamais le chargement de
  // l'app si ça échoue (navigateur non compatible, etc.) — best effort silencieux.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
